<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="14" fill="#050816"/>
  <defs>
    <linearGradient id="g" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#00d4aa"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
  </defs>
  <!--
    Waveform bars: all vertically centered at y=32.
    Heights matched to the genlift-logo.png icon proportions:
      Bar 1: short   (~10)
      Bar 2: medium  (~20)
      Bar 3: tallest (~34)  — center bar
      Bar 4: tall    (~26)
      Bar 5: medium  (~16)
    Bars are 4px wide with 3px gaps = 7px pitch, tightly grouped like the logo.
    Total width of 5 bars = 4*5 + 3*4 = 32px, centered at x=32 → starts at x=16.
  -->
  <rect x="16" y="27" width="4" height="10" rx="2" fill="url(#g)"/>
  <rect x="23" y="22" width="4" height="20" rx="2" fill="url(#g)"/>
  <rect x="30" y="15" width="4" height="34" rx="2" fill="url(#g)"/>
  <rect x="37" y="19" width="4" height="26" rx="2" fill="url(#g)"/>
  <rect x="44" y="24" width="4" height="16" rx="2" fill="url(#g)"/>
  <!-- Flanking dots: small circles at y=32, just outside the bar group -->
  <circle cx="12" cy="32" r="2" fill="url(#g)"/>
  <circle cx="52" cy="32" r="2" fill="url(#g)"/>
</svg>