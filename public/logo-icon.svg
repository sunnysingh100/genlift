<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="main-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="wave-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  
  <!-- Voice waveform bars - forms upward-lifting pattern -->
  <rect x="100" y="228" width="28" height="112" rx="14" fill="url(#wave-grad)" opacity="0.45"/>
  <rect x="156" y="168" width="28" height="232" rx="14" fill="url(#wave-grad)" opacity="0.65"/>
  <rect x="216" y="104" width="36" height="360" rx="18" fill="url(#main-grad)"/>
  <rect x="260" y="104" width="36" height="360" rx="18" fill="url(#main-grad)"/>
  <rect x="328" y="168" width="28" height="232" rx="14" fill="url(#wave-grad)" opacity="0.65"/>
  <rect x="384" y="228" width="28" height="112" rx="14" fill="url(#wave-grad)" opacity="0.45"/>
  
  <!-- Upward lift chevron -->
  <path d="M196 96 L256 36 L316 96" stroke="url(#main-grad)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
