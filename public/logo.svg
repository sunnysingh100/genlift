<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="main-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="wave-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#050816"/>
    </linearGradient>
  </defs>
  
  <!-- Background rounded square -->
  <rect width="512" height="512" rx="96" fill="url(#bg-grad)"/>
  
  <!-- Subtle inner glow -->
  <rect x="4" y="4" width="504" height="504" rx="92" fill="none" stroke="url(#main-grad)" stroke-width="1.5" opacity="0.2"/>
  
  <!-- Central voice waveform bars (stylized equalizer / voice pattern) -->
  <!-- These form an upward-lifting pattern, shorter on edges, tallest in center -->
  <rect x="152" y="228" width="24" height="100" rx="12" fill="url(#wave-grad)" opacity="0.5"/>
  <rect x="196" y="180" width="24" height="196" rx="12" fill="url(#wave-grad)" opacity="0.7"/>
  <rect x="240" y="136" width="32" height="284" rx="16" fill="url(#main-grad)"/>
  <rect x="292" y="180" width="24" height="196" rx="12" fill="url(#wave-grad)" opacity="0.7"/>
  <rect x="336" y="228" width="24" height="100" rx="12" fill="url(#wave-grad)" opacity="0.5"/>
  
  <!-- Upward chevron / lift indicator above the waveform -->
  <path d="M216 120 L256 80 L296 120" stroke="url(#main-grad)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  
  <!-- Small accent dot at top -->
  <circle cx="256" cy="68" r="6" fill="url(#main-grad)" opacity="0.8"/>
</svg>
