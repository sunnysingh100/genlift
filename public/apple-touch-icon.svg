<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" fill="none">
  <defs>
    <linearGradient id="main-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="wave-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#050816"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="180" height="180" rx="36" fill="url(#bg-grad)"/>
  
  <!-- Voice bars -->
  <rect x="36" y="84" width="10" height="38" rx="5" fill="url(#wave-grad)" opacity="0.45"/>
  <rect x="56" y="64" width="10" height="78" rx="5" fill="url(#wave-grad)" opacity="0.65"/>
  <rect x="78" y="44" width="13" height="118" rx="6.5" fill="url(#main-grad)"/>
  <rect x="93" y="44" width="13" height="118" rx="6.5" fill="url(#main-grad)"/>
  <rect x="116" y="64" width="10" height="78" rx="5" fill="url(#wave-grad)" opacity="0.65"/>
  <rect x="136" y="84" width="10" height="38" rx="5" fill="url(#wave-grad)" opacity="0.45"/>
  
  <!-- Chevron -->
  <path d="M70 40 L90 20 L110 40" stroke="url(#main-grad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  
  <!-- Dot -->
  <circle cx="90" cy="14" r="3" fill="url(#main-grad)" opacity="0.8"/>
</svg>
